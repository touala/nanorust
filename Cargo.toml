[package]
name = "nanorust"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/touala/nanorust"
readme = "README.md"
description = "Fast Rust reimplementation of the nanoT parsing pipelines (dorado / DNAscent BrdU and EdU mod-call BAM -> alldata.rds + coverage bigWig)"

[dependencies]
anyhow = "1.0.104"
bigtools = { version = "0.5.8", default-features = false, features = ["read", "write"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libdeflater = "1.26"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
